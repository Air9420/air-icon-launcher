[package]
name = "air_mchose_profile"
version = "0.1.0"
edition = "2021"
description = "MCHOSE onboard profile switcher for Air Icon Launcher"
license = "MIT"
publish = false

[lib]
name = "air_mchose_profile"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = { version = "2", default-features = false }
ureq = { version = "2", default-features = false, features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[profile.release]
lto = true
opt-level = "s"
strip = true
panic = "abort"
