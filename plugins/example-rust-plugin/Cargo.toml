[package]
name = "air_example_rust"
version = "0.1.0"
edition = "2021"
description = "Air Icon Launcher example Rust capability plugin (cdylib ABI v1)"
license = "MIT"
publish = false

[lib]
name = "air_example_rust"
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[profile.release]
# 插件 DLL 与宿主独立编译；不继承 src-tauri 的 panic=abort 也可，但保持小体积
lto = true
opt-level = 3
strip = true
