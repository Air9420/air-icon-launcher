[package]
name = "air_proxy_disable"
version = "0.1.0"
edition = "2021"
description = "Air Icon Launcher plugin: disable Windows system proxy on autostart"
license = "MIT"
publish = false

[lib]
name = "air_proxy_disable"
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
winreg = "0.52"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Networking_WinInet",
] }

[profile.release]
lto = true
opt-level = 3
strip = true
