[package]
name = "air-icon-launcher"
version = "0.6.0"
description = "A Windows desktop launcher for organizing and launching apps"
authors = ["Air"]
license = "MIT"
edition = "2021"
repository = "https://github.com/your-username/air-icon-launcher"
documentation = "https://github.com/your-username/air-icon-launcher#readme"
keywords = ["launcher", "desktop", "windows", "tauri"]
categories = ["gui"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "air_icon_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-mcp-bridge = "0.11"
tauri-plugin-updater = "2"
time = { version = "0.3", features = ["formatting"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "bmp", "gif", "webp"] }
windows = { version = "0.54", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Accessibility",
    "Win32_UI_ColorSystem",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_System_WindowsProgramming",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
] }
windows-service = "0.7"
arboard = "3"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
once_cell = "1"
regex = "1"
winreg = "0.52"
fuzzy-matcher = "0.3"
pinyin = "0.11"
rusqlite = { version = "0.31", features = ["bundled"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "fs", "io-util"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rayon = "1.10"
quick-xml = "0.38"
rfd = "0.15"
lcms2 = "6.1.1"
libloading = "0.8"

[profile.dev]
incremental = true # 浠ヨ緝灏忕殑姝ラ缂栬瘧鎮ㄧ殑浜岃繘鍒舵枃浠躲€?
[profile.release]
codegen-units = 1 # 鍏佽 LLVM 鎵ц鏇村ソ鐨勪紭鍖栥€?lto = true        # 鍚敤閾炬帴鏃朵紭鍖栥€?opt-level = 3     # 浼樺厛鑰冭檻灏忕殑浜岃繘鍒舵枃浠跺ぇ灏忋€傚鏋滄偍鏇村枩娆㈤€熷害锛岃浣跨敤 `3`銆?panic = "abort"   # 閫氳繃绂佺敤 panic 澶勭悊绋嬪簭鏉ユ彁楂樻€ц兘銆?strip = true      # 纭繚绉婚櫎璋冭瘯绗﹀彿銆?
